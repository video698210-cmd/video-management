<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة ومراجعة الفيديوهات</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#0f172a;color:#f8fafc;min-height:100vh}
#login-screen{position:fixed;inset:0;background:#0f172a;display:flex;justify-content:center;align-items:center;z-index:1000}
.card{background:#1e293b;padding:32px;border-radius:12px;border:1px solid #334155;width:420px;max-width:94vw;text-align:center}
h2,h3{color:#38bdf8;margin-bottom:18px}
.fg{margin-bottom:14px;text-align:right}.fg label,.lbl{display:block;font-size:13px;color:#94a3b8;margin-bottom:6px}
.fc{width:100%;padding:11px;background:#0f172a;border:1px solid #334155;color:#fff;border-radius:6px;font-size:14px}
.btn{width:100%;background:#0284c7;color:#fff;border:0;padding:11px;font-weight:bold;border-radius:6px;cursor:pointer;margin-bottom:8px}
.btn:hover{background:#0369a1}.btn:disabled{opacity:.6}.danger{background:#dc2626}.danger:hover{background:#b91c1c}.ok{background:#15803d}
.credit{text-align:center;font-size:12px;color:#64748b;border-top:1px solid #334155;padding-top:10px;margin-top:16px}.credit span{color:#38bdf8;font-weight:600}
#app{display:none;min-height:100vh}
.side{width:400px;max-width:45vw;background:#1e293b;border-left:1px solid #334155;padding:20px;display:flex;flex-direction:column;justify-content:space-between;overflow-y:auto;height:100vh;position:fixed;right:0;top:0}
.main{margin-right:400px;padding:24px;min-height:100vh;display:flex;justify-content:center;align-items:center}
.player{width:100%;max-width:1000px;height:78vh;background:#000;border:1px solid #334155;border-radius:12px;overflow:hidden;display:flex;justify-content:center;align-items:center}
.player iframe{width:100%;height:100%;border:0}.ph{color:#64748b;text-align:center}
.box{background:#0f172a;border:1px solid #334155;border-radius:6px;padding:10px;font-size:14px;font-weight:bold;margin-bottom:14px}
.sec{border-top:1px solid #334155;padding-top:14px;margin-top:14px}
.item{background:#0f172a;border:1px solid #334155;padding:10px;border-radius:6px;margin-bottom:8px;cursor:pointer;font-size:13px}
.item:hover,.item.active{border-color:#38bdf8;background:#0c4a6e}.small{font-size:11px;color:#94a3b8;margin-top:4px}
.st-approved{color:#4ade80}.st-rejected{color:#f87171}.st-pending{color:#fbbf24}
.bar{height:8px;background:#334155;border-radius:4px;overflow:hidden;margin-top:8px}.bar>div{height:100%;background:#38bdf8}
.row{display:flex;gap:8px}.row>*{flex:1}
.modal{display:none;position:fixed;inset:0;background:#000b;justify-content:center;align-items:center;z-index:2000}
.mc{background:#1e293b;padding:24px;border-radius:10px;width:520px;max-width:94vw;max-height:90vh;overflow-y:auto;border:1px solid #334155}
.urow{display:flex;justify-content:space-between;align-items:center;gap:6px;background:#0f172a;border:1px solid #334155;padding:8px;border-radius:6px;margin-bottom:6px;font-size:13px}
.urow button{width:auto;padding:5px 9px;font-size:12px;margin:0}
@media(max-width:800px){.side{position:static;width:100%;max-width:none;height:auto;order:2}.main{margin-right:0;padding:10px;min-height:50vh}.player{height:50vh}#app{display:none;flex-direction:column}}
</style></head>
<body>
<div id="login-screen"><div class="card">
<h2>إدارة ومراجعة الفيديوهات</h2>
<div class="fg"><label>اسم المستخدم</label><input id="username" class="fc" autocomplete="username"></div>
<div class="fg"><label>كلمة المرور</label><input id="password" type="password" class="fc" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
<button class="btn" id="login-btn" onclick="login()">دخول النظام</button>
<div class="credit">Designed By <span>Mohamed Gomaa</span></div>
</div></div>

<div id="app">
<aside class="side"><div>
<h3 id="panel-title"></h3>
<div class="lbl">المستخدم</div><div class="box" id="who"></div>

<div id="search-sec" style="display:none"><div class="lbl" style="color:#38bdf8">بحث برقم الطلب (كل الشركات)</div>
<input id="search-input" class="fc" placeholder="اكتب رقم الطلب..." oninput="debounceSearch()" style="margin-bottom:10px">
<div id="results" style="max-height:220px;overflow:auto"></div></div>

<div id="upload-sec" class="sec" style="display:none"><div class="lbl" style="color:#38bdf8">رفع فيديو إثبات</div>
<input id="req-number" class="fc" placeholder="رقم الطلب" style="margin-bottom:8px">
<input type="file" id="file-upload" accept="video/*" class="fc" style="margin-bottom:8px">
<button class="btn" id="upload-btn" onclick="uploadVideo()">رفع الفيديو</button>
<div class="small" id="upload-status">الحد الأقصى 500 ميجا للفيديو</div></div>

<div id="manage-sec" class="sec" style="display:none"><div class="lbl" style="color:#38bdf8">الإدارة</div><div id="manage-btns"></div></div>

<div id="review-sec" class="sec" style="display:none"><div class="lbl" style="color:#38bdf8">قرار المراجعة</div>
<div class="box" id="review-who"></div>
<textarea id="review-note" class="fc" rows="2" placeholder="ملاحظات المراجع" style="margin-bottom:8px"></textarea>
<div class="row"><button class="btn ok" onclick="review('approved')">اعتماد</button><button class="btn danger" onclick="review('rejected')">رفض</button></div>
<div class="small" id="review-meta"></div></div>

<div id="storage-sec" class="sec" style="display:none"><div class="lbl" style="color:#38bdf8">مساحة التخزين (Google Drive)</div>
<div class="box" id="storage-text">...</div><div class="bar"><div id="storage-bar" style="width:0"></div></div><div class="small" id="storage-detail"></div></div>
</div>
<div><button class="btn danger" onclick="logout()">تسجيل الخروج</button><div class="credit">Designed By <span>Mohamed Gomaa</span></div></div>
</aside>
<main class="main"><div class="player"><div class="ph" id="ph">اختر فيديو من القائمة لبدء المشاهدة</div><iframe id="frame" allow="autoplay;fullscreen" allowfullscreen style="display:none"></iframe></div></main>
</div>

<div class="modal" id="modal"><div class="mc">
<h3 id="m-title"></h3>
<div class="fg"><label id="m-name-l">الاسم</label><input id="m-name" class="fc"></div>
<div class="fg"><label>اسم المستخدم (إنجليزي)</label><input id="m-user" class="fc"></div>
<div class="fg"><label>كلمة المرور (6 أحرف على الأقل)</label><input id="m-pass" type="text" class="fc"></div>
<button class="btn" onclick="createUser()">حفظ</button>
<div id="m-list" style="margin:10px 0"></div>
<button class="btn danger" onclick="closeModal()">إغلاق</button>
</div></div>

<script>
/* ضع هنا رابط Web App الناتج من Apps Script (ينتهي بـ /exec) */
const API = "https://script.google.com/macros/s/AKfycbzFjL2Yyo7oyiVAxoz8jCq9G2wZtcbkXRlzeAPm1m54kxz-rsHpUFYwx_3tvknxu7U/exec";
const MAX = 500 * 1024 * 1024;
const $ = id => document.getElementById(id);
let S = null, selected = null, modalRole = null, timer = null;
try { S = JSON.parse(sessionStorage.getItem('gj') || 'null'); } catch (e) {}

async function api(action, data = {}) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: S && S.token, ...data }) });
  let d; try { d = await r.json(); } catch (e) { throw new Error('رد غير صالح من السيرفر: تأكد أن رابط API صحيح وينتهي بـ /exec وأنك نشرت نسخة جديدة'); }
  if (!d.ok) { if (d.error === 'SESSION') { sessionStorage.removeItem('gj'); alert('انتهت الجلسة، سجّل الدخول من جديد'); location.reload(); } throw new Error(d.error); }
  return d;
}
async function login() {
  const b = $('login-btn'); b.disabled = true;
  try { const d = await api('login', { username: $('username').value.trim(), password: $('password').value }); S = { token: d.token, user: d.user }; sessionStorage.setItem('gj', JSON.stringify(S)); start(); }
  catch (e) { alert(e.message); } finally { b.disabled = false; }
}
function logout() { sessionStorage.removeItem('gj'); location.reload(); }

const TITLES = { admin: 'لوحة تحكم الأدمن', reviewer: 'بوابة مراجعة الفيديوهات', company_admin: 'إدارة الشركة', employee: 'رفع الإثباتات' };
function start() {
  const u = S.user, r = u.role;
  $('login-screen').style.display = 'none'; $('app').style.display = 'flex';
  $('panel-title').textContent = TITLES[r];
  $('who').textContent = u.name + (u.company && r !== 'company_admin' ? ' — ' + u.company : '');
  $('search-sec').style.display = 'block';
  $('upload-sec').style.display = r === 'employee' ? 'block' : 'none';
  $('review-sec').style.display = (r === 'admin' || r === 'reviewer') ? 'block' : 'none';
  $('review-who').textContent = 'سيُسجَّل القرار باسم: ' + u.name;
  $('storage-sec').style.display = r === 'employee' ? 'none' : 'block';
  const m = $('manage-btns'); m.innerHTML = '';
  const add = (t, f) => { const x = document.createElement('button'); x.className = 'btn'; x.textContent = t; x.onclick = f; m.appendChild(x); };
  if (r === 'admin') { add('⚙️ إدارة حسابات الشركات', () => openModal('company_admin')); add('👤 إدارة حسابات المراجعين', () => openModal('reviewer')); }
  if (r === 'company_admin') add('+ إدارة حسابات الموظفين', () => openModal('employee'));
  $('manage-sec').style.display = m.children.length ? 'block' : 'none';
  if (r !== 'employee') loadStorage();
  search();
}
function debounceSearch() { clearTimeout(timer); timer = setTimeout(search, 350); }

async function search() {
  const box = $('results'); box.textContent = 'جارٍ البحث...';
  try {
    const d = await api('search', { q: $('search-input').value.trim() });
    box.innerHTML = '';
    if (!d.videos.length) { box.textContent = 'لا توجد فيديوهات'; return; }
    d.videos.forEach(v => {
      const el = document.createElement('div'); el.className = 'item' + (selected && selected.id === v.id ? ' active' : '');
      const t = document.createElement('div'); t.textContent = 'طلب ' + v.req + ' — ' + v.company;
      const s = document.createElement('div'); s.className = 'small';
      const st = document.createElement('span'); st.className = 'st-' + v.status; st.textContent = { approved: 'معتمد', rejected: 'مرفوض', pending: 'قيد المراجعة', deleted: 'محذوف تلقائيًا' }[v.status] || v.status;
      s.append(st, ' — ' + v.employee + ' — ' + v.uploadedAt);
      el.append(t, s); el.onclick = () => pick(v, el); box.appendChild(el);
    });
  } catch (e) { box.textContent = 'خطأ: ' + e.message; }
}
function pick(v, el) {
  selected = v;
  document.querySelectorAll('.item').forEach(x => x.classList.remove('active')); el.classList.add('active');
  if (v.fileId) { $('frame').src = 'https://drive.google.com/file/d/' + encodeURIComponent(v.fileId) + '/preview'; $('frame').style.display = 'block'; $('ph').style.display = 'none'; }
  else { $('frame').style.display = 'none'; $('ph').style.display = 'block'; $('ph').textContent = 'هذا الفيديو تم حذفه تلقائيًا لتوفير مساحة التخزين'; }
  $('review-note').value = v.note || '';
  $('review-meta').textContent = v.reviewer ? 'آخر قرار: ' + ({ approved: 'اعتماد', rejected: 'رفض' }[v.status]) + ' بواسطة ' + v.reviewer + ' — ' + v.reviewedAt : 'لم تتم مراجعة الفيديو بعد';
}
async function review(status) {
  if (!selected) return alert('اختر فيديو أولًا');
  try { const d = await api('review', { id: selected.id, status, note: $('review-note').value.trim() });
    $('review-meta').textContent = (status === 'approved' ? 'تم الاعتماد' : 'تم الرفض') + ' بواسطة ' + d.reviewer + ' — ' + d.reviewedAt;
    selected = { ...selected, status, reviewer: d.reviewer, reviewedAt: d.reviewedAt }; search();
  } catch (e) { alert(e.message); }
}

async function loadStorage() {
  try {
    const d = await api('storage'), gb = n => (n / 1073741824).toFixed(2), mb = n => (n / 1048576).toFixed(1);
    $('storage-text').textContent = 'المستخدم ' + gb(d.used) + ' من ' + gb(d.limit) + ' جيجا';
    $('storage-bar').style.width = Math.min(100, d.used / d.limit * 100) + '%';
    $('storage-detail').textContent = 'المتبقي: ' + gb(d.limit - d.used) + ' جيجا — فيديوهات النظام: ' + d.videosCount + ' (' + mb(d.videosBytes) + ' ميجا)';
  } catch (e) { $('storage-text').textContent = 'تعذر قراءة المساحة'; }
}

const CHUNK = 1572864; /* 6 x 256KB */
function b64(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onerror = () => rej(new Error('تعذرت قراءة الملف')); r.onload = () => res(String(r.result).split(',')[1]); r.readAsDataURL(blob); }); }
async function sendChunk(uploadId, f, start, tries = 4) {
  const end = Math.min(start + CHUNK, f.size), data = await b64(f.slice(start, end));
  for (let i = 1; ; i++) {
    try { return await api('uploadChunk', { uploadId, start, data }); }
    catch (e) { if (i >= tries || /انتهت جلسة|غير مصرح/.test(e.message)) throw e; await new Promise(r => setTimeout(r, 1500 * i)); }
  }
}
async function uploadVideo() {
  const f = $('file-upload').files[0], req = $('req-number').value.trim(), st = $('upload-status'), btn = $('upload-btn');
  if (!f || !req) return alert('اختر فيديو وأدخل رقم الطلب');
  if (!f.type.startsWith('video/')) return alert('الملف ليس فيديو');
  if (f.size > MAX) return alert('حجم الفيديو أكبر من 500 ميجا');
  btn.disabled = true;
  try {
    st.textContent = 'جارٍ التجهيز...';
    const { uploadId } = await api('initUpload', { req, size: f.size, fileName: f.name, mimeType: f.type || 'video/mp4' });
    let fileId = null;
    for (let start = 0; start < f.size; start += CHUNK) {
      st.textContent = 'جارٍ الرفع إلى Drive... ' + Math.round(start / f.size * 100) + '%';
      const r = await sendChunk(uploadId, f, start);
      if (r.done) fileId = r.fileId;
    }
    if (!fileId) throw new Error('Drive لم يؤكد اكتمال الرفع');
    st.textContent = 'جارٍ الحفظ...';
    await api('finishUpload', { fileId, req });
    st.textContent = 'تم رفع الفيديو بنجاح — الحالة: قيد المراجعة';
    $('file-upload').value = ''; $('search-input').value = req; search();
  } catch (e) { st.textContent = 'فشل الرفع: ' + e.message; alert('فشل الرفع: ' + e.message); }
  finally { btn.disabled = false; }
}

const MT = { company_admin: ['إدارة حسابات الشركات', 'اسم الشركة'], reviewer: ['إدارة حسابات المراجعين', 'اسم المراجع'], employee: ['إدارة حسابات الموظفين', 'اسم الموظف'] };
function openModal(role) { modalRole = role; $('m-title').textContent = MT[role][0]; $('m-name-l').textContent = MT[role][1]; ['m-name', 'm-user', 'm-pass'].forEach(i => $(i).value = ''); $('modal').style.display = 'flex'; loadUsers(); }
function closeModal() { $('modal').style.display = 'none'; }
async function createUser() {
  try { await api('createUser', { role: modalRole, name: $('m-name').value, username: $('m-user').value, password: $('m-pass').value });
    ['m-name', 'm-user', 'm-pass'].forEach(i => $(i).value = ''); loadUsers(); } catch (e) { alert(e.message); }
}
async function loadUsers() {
  const box = $('m-list'); box.textContent = 'جارٍ التحميل...';
  try {
    const d = await api('listUsers'); box.innerHTML = '';
    d.users.filter(u => u.role === modalRole).forEach(u => {
      const el = document.createElement('div'); el.className = 'urow';
      const t = document.createElement('span'); t.textContent = u.name + ' (' + u.username + ')' + (u.active ? '' : ' — موقوف');
      const a = document.createElement('button'); a.className = 'btn ' + (u.active ? 'danger' : 'ok'); a.textContent = u.active ? 'إيقاف' : 'تفعيل';
      a.onclick = async () => { try { await api('setActive', { username: u.username, active: !u.active }); loadUsers(); } catch (e) { alert(e.message); } };
      const p = document.createElement('button'); p.className = 'btn'; p.textContent = 'كلمة مرور';
      p.onclick = async () => { const np = prompt('كلمة المرور الجديدة'); if (!np) return; try { await api('resetPass', { username: u.username, password: np }); alert('تم التغيير'); } catch (e) { alert(e.message); } };
      el.append(t, a, p); box.appendChild(el);
    });
    if (!box.children.length) box.textContent = 'لا توجد حسابات بعد';
  } catch (e) { box.textContent = e.message; }
}

if (S) start();
</script></body></html>
